name: Force Update (Re-scrape + Re-summarize)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fanqie-rank-writes-main
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: '目标日期 (YYYYMMDD)，默认当天'
        required: false
        default: ''
        type: string
      channel:
        description: '频道 female/male，空=全部'
        required: false
        default: ''
        type: string
      board:
        description: '榜种 new/read，空=全部'
        required: false
        default: ''
        type: string

jobs:
  force-update:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: main
        fetch-depth: 0

    - name: Sync Latest Main
      run: git pull --ff-only origin main

    - name: Determine target date
      id: date
      run: |
        INPUT="${{ github.event.inputs.target_date }}"
        if [ -z "$INPUT" ]; then
          TARGET=$(date -u +"%Y%m%d")
        else
          TARGET="$INPUT"
        fi
        echo "target=$TARGET" >> $GITHUB_OUTPUT
        TODAY=$(date -u +"%Y%m%d")
        if [ "$TARGET" = "$TODAY" ]; then
          echo "is_today=true" >> $GITHUB_OUTPUT
        else
          echo "is_today=false" >> $GITHUB_OUTPUT
        fi
        DASH_DATE="${TARGET:0:4}-${TARGET:4:2}-${TARGET:6:2}"
        echo "dash_date=$DASH_DATE" >> $GITHUB_OUTPUT
        echo "📅 目标日期: $DASH_DATE"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        if [ "${{ steps.date.outputs.is_today }}" = "true" ]; then
          playwright install --with-deps chromium
        fi

    - name: Run Scraper (仅当天)
      if: steps.date.outputs.is_today == 'true'
      run: |
        ARGS=""
        if [ -n "${{ github.event.inputs.channel }}" ]; then
          ARGS="$ARGS --channel ${{ github.event.inputs.channel }}"
        fi
        if [ -n "${{ github.event.inputs.board }}" ]; then
          ARGS="$ARGS --board ${{ github.event.inputs.board }}"
        fi
        python scrape_fanqie_ranks.py $ARGS
      env:
        GITHUB_ACTIONS: true

    - name: Build Latest Data with AI Summary (Force)
      run: |
        ARGS="--force --date ${{ steps.date.outputs.dash_date }}"
        if [ -n "${{ github.event.inputs.channel }}" ]; then
          ARGS="$ARGS --channel ${{ github.event.inputs.channel }}"
        fi
        if [ -n "${{ github.event.inputs.board }}" ]; then
          ARGS="$ARGS --board ${{ github.event.inputs.board }}"
        fi
        pip install openai && python scripts/build_latest.py $ARGS
      env:
        API_BASE_URL: ${{ secrets.API_BASE_URL }}
        API_KEY: ${{ secrets.API_KEY }}
        API_MODEL: ${{ secrets.API_MODEL }}

    - name: Sync Latest Main Before Commit
      run: git pull --rebase --autostash origin main

    - name: Commit and Push Changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "[Force] Re-summarize Fanqie ranks (${{ steps.date.outputs.dash_date }})"
        file_pattern: data api
        branch: main

    - name: Setup Pages
      uses: actions/configure-pages@v5
      with:
        enablement: true

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
